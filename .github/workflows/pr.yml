name: CI

on:
  pull_request:
    branches:
      - development
      - 1.8.x

jobs:
  lint:
    name: Lint code (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refs/pull/${{ github.event.number }}/merge
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: make dev-env
      - name: Lint
        run: make lint

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refs/pull/${{ github.event.number }}/merge
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: make dev-env
      - name: Run unit tests
        run: make test

  integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: [ self-hosted, Linux ]
    strategy:
      matrix:
        python-version: [3.9, 3.11]
        include:
          - python-version: 3.9
            image: python:3.9.18
          - python-version: 3.11
            image: python:3.11.8
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: refs/pull/${{ github.event.number }}/merge
      - name: Install dependencies
        run: make dev-env
      - name: Check if V3IO_API is set
        run: |
          if [ -z "$V3IO_API" ]; then
            echo "V3IO_API is NOT set"
          else
            echo "V3IO_API is set"
          fi
      - name: Run integration tests
        env:
          V3IO_API: ${{ secrets.V3IO_API }}
          V3IO_ACCESS_KEY: ${{ secrets.V3IO_ACCESS_KEY }}
          V3IO_FRAMESD: ${{ secrets.V3IO_FRAMESD }}
        run: make integration
