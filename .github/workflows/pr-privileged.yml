name: CI Privileged

permissions:
  contents: read

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

jobs:
  internal_integration:
    name: Internal integration worker
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.11
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Install dependencies
        run: make dev-env
      - name: Run integration tests
        env:
          V3IO_API: ${{ secrets.V3IO_API }}
          V3IO_ACCESS_KEY: ${{ secrets.V3IO_ACCESS_KEY }}
          V3IO_FRAMESD: ${{ secrets.V3IO_FRAMESD }}
        run: make integration

  fork_integration:
    name: Authorized fork integration worker
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name != github.repository &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'safe-to-test'
      }}
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.11
    steps:
      # Applying safe-to-test authorizes only the immutable SHA in this labeled event.
      # Review that SHA before labeling, and reapply the label only after a later
      # commit causes the reset workflow to remove it.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Install dependencies
        run: make dev-env
      - name: Run integration tests
        env:
          V3IO_API: ${{ secrets.V3IO_API }}
          V3IO_ACCESS_KEY: ${{ secrets.V3IO_ACCESS_KEY }}
          V3IO_FRAMESD: ${{ secrets.V3IO_FRAMESD }}
        run: make integration

  integration:
    name: Integration tests
    needs: [internal_integration, fork_integration]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Report same-repository integration result
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          WORKER_RESULT: ${{ needs.internal_integration.result }}
        run: |
          if [ "${WORKER_RESULT}" != "success" ]; then
            echo "Internal integration worker result: ${WORKER_RESULT}"
            exit 1
          fi

      - name: Report authorized fork integration result
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name != github.repository &&
            github.event.action == 'labeled' &&
            github.event.label.name == 'safe-to-test'
          }}
        env:
          WORKER_RESULT: ${{ needs.fork_integration.result }}
        run: |
          if [ "${WORKER_RESULT}" != "success" ]; then
            echo "Authorized fork integration worker result: ${WORKER_RESULT}"
            exit 1
          fi

      - name: Require authorization for external fork
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name != github.repository &&
            !(
              github.event.action == 'labeled' &&
              github.event.label.name == 'safe-to-test'
            )
          }}
        run: |
          echo "Privileged integration tests are required for external forks."
          echo "Review the current head SHA, then apply the safe-to-test label to authorize that exact commit."
          echo "After the fork pushes another commit, the label is removed and the new SHA must be reviewed and relabeled."
          exit 1
